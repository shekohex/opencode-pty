<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTY Sessions Monitor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #root {
        height: 100%;
      }
      .container {
        display: flex;
        height: 100%;
        overflow: hidden;
      }
      .sidebar {
        width: 300px;
        background: #161b22;
        border-right: 1px solid #30363d;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sidebar-header {
        padding: 16px;
        border-bottom: 1px solid #30363d;
        background: #161b22;
      }
      .sidebar-header h1 {
        font-size: 18px;
        font-weight: 600;
        color: #58a6ff;
      }
      .session-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .session-item {
        padding: 12px;
        margin-bottom: 8px;
        background: #21262d;
        border: 1px solid #30363d;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .session-item:hover {
        background: #30363d;
      }
      .session-item.active {
        border-color: #58a6ff;
        background: #1f6feb1a;
      }
      .session-title {
        font-weight: 600;
        margin-bottom: 4px;
        color: #c9d1d9;
      }
      .session-info {
        font-size: 12px;
        color: #8b949e;
        display: flex;
        justify-content: space-between;
      }
      .status-badge {
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .status-running {
        background: #238636;
        color: #fff;
      }
      .status-exited {
        background: #da3633;
        color: #fff;
      }
      .status-killed {
        background: #8957e5;
        color: #fff;
      }
      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .output-header {
        padding: 16px;
        border-bottom: 1px solid #30363d;
        background: #161b22;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .output-title {
        font-size: 16px;
        font-weight: 600;
      }
      .kill-btn {
        padding: 8px 16px;
        background: #da3633;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
      }
      .kill-btn:hover {
        background: #f85149;
      }
      .output-container {
        flex: 1;
        overflow: auto;
        background: #0d1117;
        padding: 16px;
        font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .output-line {
        margin-bottom: 2px;
      }
      .input-container {
        padding: 16px;
        border-top: 1px solid #30363d;
        background: #161b22;
        display: flex;
        gap: 8px;
      }
      .input-field {
        flex: 1;
        padding: 10px 14px;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #c9d1d9;
        font-family: inherit;
        font-size: 14px;
      }
      .input-field:focus {
        outline: none;
        border-color: #58a6ff;
      }
      .send-btn {
        padding: 10px 20px;
        background: #238636;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
      }
      .send-btn:hover {
        background: #2ea043;
      }
      .empty-state {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #8b949e;
        font-size: 16px;
      }
      .connection-status {
        padding: 8px 16px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
        font-size: 12px;
        color: #8b949e;
      }
      .connection-status.connected {
        color: #238636;
      }
      .connection-status.disconnected {
        color: #da3633;
      }
      .kill-btn:disabled,
      .kill-btn[disabled] {
        background: #484f58;
        color: #8b949e;
        cursor: not-allowed;
      }
      .kill-btn:disabled:hover,
      .kill-btn[disabled]:hover {
        background: #484f58;
      }
      .auth-warning {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 1000;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 380px;
        border: 1px solid #d29922;
        background: rgba(36, 28, 14, 0.92);
        color: #e3b341;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 12px;
        line-height: 1.4;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(4px);
      }
      .auth-warning-icon {
        flex-shrink: 0;
        font-size: 14px;
      }
      .auth-warning-text {
        color: #e3b341;
      }
      .auth-warning code {
        font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 4px;
        border-radius: 3px;
        font-size: 11px;
        color: #f0c674;
      }
      .terminal-readonly-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        margin-top: 4px;
        border: 1px solid #d29922;
        background: rgba(210, 153, 34, 0.08);
        color: #e3b341;
        font-size: 12px;
        line-height: 1.4;
        border-radius: 4px;
      }
      .xterm-readonly .xterm-viewport,
      .xterm-readonly .xterm-screen {
        opacity: 0.85;
      }
      .auth-warning-dismiss {
        background: transparent;
        border: none;
        color: #e3b341;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 0 2px;
        margin-left: 4px;
        opacity: 0.7;
      }
      .auth-warning-dismiss:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
